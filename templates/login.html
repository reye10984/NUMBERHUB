{% extends "base.html" %}{% block body %}<h1>Log in</h1>
<form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Email<input type="email" name="email" required autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button>Log in</button></form><p>No account? <a href="{{ url_for('register') }}">Register</a></p>{% endblock %}
